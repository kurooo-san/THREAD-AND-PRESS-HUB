<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#131313">
    <title>You're offline - Thread &amp; Press Hub</title>
    <style>
        /* Self-contained: shown by sw.js when there is no connection, so it
           cannot rely on any other file loading. */
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #131313;
            color: #f2f0ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .box { max-width: 340px; }
        .icon {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #26262c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 { font-size: 1.35rem; margin: 0 0 8px; }
        p { margin: 0 0 24px; color: #aaa69e; line-height: 1.5; font-size: 0.95rem; }
        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 28px;
            background: #c8a96e;
            color: #16140f;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c8a96e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>Thread &amp; Press Hub needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
